<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width"><script src="https://telegram.org/js/telegram-web-app.js"></script></head><body style="text-align:center;background:#111;color:white;padding-top:50px">
<h1>Coin Tap</h1>
<div id="coins">0</div>
<button onclick="coins++ ; document.getElementById('coins').innerText=coins" style="padding:20px 40px;font-size:30px">TAP</button>
<br><br>
<button id="buy" style="background:gold;padding:15px">Buy 1000 Coins - 100 Stars ⭐</button>
<script>
let coins=0;
const tg=window.Telegram.WebApp;
tg.ready();
document.getElementById('buy').onclick=async()=>{
  const r=await fetch('/api/invoice');
  const j=await r.json();
  if(!j.invoiceLink) return alert('Error: '+JSON.stringify(j));
  tg.openInvoice(j.invoiceLink,(status)=>{
    if(status=='paid'){coins+=1000;document.getElementById('coins').innerText=coins; alert('Paid! +1000 coins');}
  });
};
</script>
</body></html>
